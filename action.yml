name: mdbisync
description: Two-way sync between Markdown files in a Git repository and Linear documents.
inputs:
  operation:
    description: "What to run: `sync` (the recurring two-way sync) or `initial-sync` (the one-time sync that makes one side match the other)."
    required: false
    default: sync
  linear-client-id:
    description: "Client ID of the Linear OAuth app (client credentials, scopes read and write)."
    required: true
  linear-client-secret:
    description: "Client secret of the Linear OAuth app."
    required: true
  linear-api-url:
    description: "Linear API origin. Leave empty for Linear itself."
    required: false
    default: ""
  github-token:
    description: "Installation token of the sync's GitHub App (contents, pull requests and workflows write; checks and commit statuses read)."
    required: true
  github-api-url:
    description: "GitHub REST API URL. Leave empty for the runner's API."
    required: false
    default: ""
  repository:
    description: "The repository as owner/name. Leave empty for the workflow's repository."
    required: false
    default: ""
  tracked-branch:
    description: "The branch the sync keeps equal to Linear."
    required: false
    default: main
  sync-branch:
    description: "The branch of the sync pull request."
    required: false
    default: mdbisync/linear
  state-ref-prefix:
    description: "Prefix of the sync's state refs."
    required: false
    default: refs/mdbisync
  document-cap:
    description: "Maximum documents per Linear container, including trash. Warn at 90%; stop before writing above the cap."
    required: false
    default: "1000"
  merge-grace-seconds:
    description: "Seconds to wait for checks after opening or updating the sync pull request (0 to 120). Zero leaves the merge to a later run."
    required: false
    default: "60"
  report-file:
    description: "Path to write the run's report as JSON (names and states only); the job summary goes beside it as summary.md. Leave empty for none."
    required: false
    default: ""
  direction:
    description: "Initial sync only, and required there: `git-to-linear` (Linear is made equal to the tracked branch) or `linear-to-git` (one pull request, which a person merges, makes the synchronized folders equal to Linear). There is no default."
    required: false
    default: ""
  confirm:
    description: "Initial sync only: `true` writes; anything else is a dry run that lists by path what would be created, overwritten, moved to Linear's trash (or, from Linear, removed from the tracked branch) and left out, and writes nothing."
    required: false
    default: ""
  security-step:
    description: "Runs the repository's security hooks in a step of their own, which holds none of this action's secrets. `stage`: read Linear's changes and leave them in the runner's temporary directory for the hooks step, writing nothing to git or Linear; the outputs `node` and `hooks` give that step its command. `apply`: run the operation with the hooks step's findings; a change the hooks have not seen is not pushed this run. Empty runs the hooks inside this step."
    required: false
    default: ""
outputs:
  node:
    description: "`security-step: stage` only: the Node.js the hooks step runs `hooks` with."
  hooks:
    description: "`security-step: stage` only: the script of the hooks step."
  code:
    description: "Why the run stopped before writing, for example `initial-sync-required`, or why a confirmed initial sync did not finish (`stopped`, `write-failed`, `state-moved`, `pull-request-failed`, `sync-branch-changed`), or why a sync's pull request step failed it (`check-failed` or `merge-blocked`, setup errors; `initial-pull-request-pending`; `state-moved` or `github-failed`, which a later run retries), or why a sync is partial (for example `removal-held`: Linear did not return documents while their place listed none, so their files stay until a later run confirms the removal while some place lists documents); empty when it finished."
runs:
  using: node24
  main: dist/action-main.js
  post: dist/action-post.js
  post-if: always()
