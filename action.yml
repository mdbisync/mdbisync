name: mdbisync
description: Two-way sync between Markdown files in a Git repository and Linear documents.
inputs:
  operation:
    description: "What to run: `sync` (the recurring two-way sync) or `initial-sync` (the one-time sync that makes one side match the other)."
    required: false
    default: sync
  linear-client-id:
    description: "Client ID of the Linear OAuth app (client credentials, scopes read and write)."
    required: true
  linear-client-secret:
    description: "Client secret of the Linear OAuth app."
    required: true
  linear-api-url:
    description: "Linear API origin. Leave empty for Linear itself."
    required: false
    default: ""
  github-token:
    description: "Installation token of the sync's GitHub App (contents, pull requests and workflows write; checks and commit statuses read)."
    required: true
  github-api-url:
    description: "GitHub REST API URL. Leave empty for the runner's API."
    required: false
    default: ""
  repository:
    description: "The repository as owner/name. Leave empty for the workflow's repository."
    required: false
    default: ""
  tracked-branch:
    description: "The branch the sync keeps equal to Linear."
    required: false
    default: main
  sync-branch:
    description: "The branch of the sync pull request."
    required: false
    default: mdbisync/linear
  state-ref-prefix:
    description: "Prefix of the sync's state refs."
    required: false
    default: refs/mdbisync
  document-cap:
    description: "Maximum documents per Linear container, including trash. Warn at 90%; stop before writing above the cap."
    required: false
    default: "1000"
  report-file:
    description: "Path to write the run's report as JSON (names and states only). Leave empty for none."
    required: false
    default: ""
  direction:
    description: "Initial sync only, and required there: `git-to-linear` (Linear is made equal to the tracked branch) or `linear-to-git`. There is no default."
    required: false
    default: ""
  confirm:
    description: "Initial sync only: `true` writes; anything else is a dry run that lists by path what would be created, overwritten, moved to Linear's trash and left out, and writes nothing."
    required: false
    default: ""
outputs:
  code:
    description: "Why the run stopped before writing, for example `initial-sync-required`, or why a confirmed initial sync did not finish (`stopped`, `write-failed`, `state-moved`); empty when it finished."
runs:
  using: node24
  main: dist/action-main.js
  post: dist/action-post.js
