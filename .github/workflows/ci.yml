name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install compatible npm
        run: npm install --global --ignore-scripts npm@11.16.0
      - name: Install dependencies (lock file only, no install scripts)
        run: npm ci
      - name: Verify registry signatures
        run: npm audit signatures
      - name: No install scripts in locked packages
        run: npm run check:install-scripts
      - name: No Cyrillic characters
        run: npm run check:cyrillic
      - name: Fixture bank matches its index
        run: npm run check:fixtures
      - name: Type check
        run: npm run typecheck
      - name: Bundle and check bundled licenses
        run: npm run build
      - name: Test
        run: npm test
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Install pre-commit
        run: pipx install pre-commit==4.6.2
      - name: Published hook and CI example integration
        run: npm run test:hooks
      - name: Pre-commit hooks
        env:
          SKIP: no-cyrillic # already run above
        run: pre-commit run --all-files --show-diff-on-failure
