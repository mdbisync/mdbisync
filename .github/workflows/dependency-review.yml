name: Dependency review

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The exceptions come from the base branch, so a pull request cannot except an advisory it introduces:
      # the exception lands on main first, in its own reviewed change.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: security/dependency-exceptions.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      # The advisories of the exceptions that are still before their review date.
      - name: Read the dependency exceptions
        id: exceptions
        run: |
          file=security/dependency-exceptions.json
          if [ ! -f "$file" ]; then echo 'ghsas=' >> "$GITHUB_OUTPUT"; exit 0; fi
          ghsas="$(jq -r --arg today "$(date -u +%F)" \
            '[.exceptions[] | select(.review >= $today) | .advisory | select(test("^GHSA(-[23456789cfghjmpqrvwx]{4}){3}$"))] | unique | join(", ")' "$file")"
          echo "ghsas=$ghsas" >> "$GITHUB_OUTPUT"
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          fail-on-scopes: runtime, development, unknown
          allow-ghsas: ${{ steps.exceptions.outputs.ghsas }}
