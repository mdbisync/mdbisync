name: Dependency scan

# Every six hours, the dependencies of `main` and of the latest final release
# are checked again against today's public advisories: a release can gain a
# known vulnerability long after it was built. The check is the release gate's
# own (`npm audit` of every lock file, minus `security/dependency-exceptions.json`).
# It blocks nothing; a finding turns the run red. The job summary is the
# readable report, the artifact holds the machine-readable results, and the
# status of the latest release is committed to the `security-status` branch,
# which the project site reads. Releases are never changed: each keeps the
# `dependency-scan.json` of its build.

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: dependency-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      release: ${{ steps.latest.outputs.tag }}
      main-blocking: ${{ steps.main.outputs.blocking }}
      release-blocking: ${{ steps.release.outputs.blocking }}
    steps:
      # The check and the exceptions always come from main; the release is read only for its lock files.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Find the latest final release
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status="$(curl -sS -o "$RUNNER_TEMP/latest.json" -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/latest")"
          case "$status" in
            200) tag="$(jq -r .tag_name "$RUNNER_TEMP/latest.json")" ;;
            404) tag='' ;;
            *) echo "Cannot read the latest release: HTTP $status" >&2; exit 1 ;;
          esac
          if [ -n "$tag" ] && ! [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "The latest release has an unexpected tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Check the dependencies of main
        id: main
        run: node src/release/dependency-scan.ts --repository . --commit HEAD --target main --output "$RUNNER_TEMP/scan/main"
      # The release commit records its source as the sole parent or, on releases, its second parent.
      - name: Check the dependencies of the latest release
        id: release
        if: ${{ !cancelled() && steps.latest.outputs.tag != '' }}
        env:
          TAG: ${{ steps.latest.outputs.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git fetch --no-tags --depth=2 origin "refs/tags/$TAG:refs/tags/$TAG"
          node src/release/dependency-scan.ts --repository . --release-tag "$TAG" --target "release $TAG" --run-url "$RUN_URL" --output "$RUNNER_TEMP/scan/release"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-scan
          path: ${{ runner.temp }}/scan
          retention-days: 90
          if-no-files-found: error

  # Commits the latest release's dependency status to the `security-status` branch, which holds
  # only that file and which the project site reads from its public raw URL. The first run creates
  # the branch with no history. It writes through the Git data API and runs no repository code.
  publish:
    needs: scan
    if: ${{ !cancelled() && needs.scan.outputs.release != '' && needs.scan.outputs.release-blocking != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      TAG: ${{ needs.scan.outputs.release }}
      BRANCH: security-status
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dependency-scan
          path: ${{ runner.temp }}/scan
      - name: Commit the dependency status to its branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          file="$RUNNER_TEMP/scan/release/dependency-scan.json"
          if ! jq -s -e --arg tag "$TAG" 'length == 1 and .[0].schema == 1 and .[0].release == $tag' "$file" > /dev/null; then
            echo "The dependency status of $TAG is missing, unreadable or names another release" >&2
            exit 1
          fi
          api="repos/$GITHUB_REPOSITORY"
          read_api() {
            curl -sS -o "$1" -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -H "Accept: $2" "$GITHUB_API_URL/$api/$3"
          }
          status="$(read_api "$RUNNER_TEMP/head.json" application/vnd.github+json "git/ref/heads/$BRANCH")"
          case "$status" in
            200) parent="$(jq -r .object.sha "$RUNNER_TEMP/head.json")" ;;
            404) parent='' ;;
            *) echo "Cannot read the $BRANCH branch: HTTP $status" >&2; exit 1 ;;
          esac
          if [ "$status" = 200 ] && ! [[ "$parent" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The $BRANCH branch has an unexpected head" >&2
            exit 1
          fi
          # A rerun of an older run must not replace a newer status.
          if [ -n "$parent" ]; then
            status="$(read_api "$RUNNER_TEMP/current.json" application/vnd.github.raw "contents/dependency-scan.json?ref=$parent")"
            if [ "$status" = 200 ] && jq -e --slurpfile current "$RUNNER_TEMP/current.json" '.checked <= $current[0].checked' "$file" > /dev/null 2>&1; then
              echo "$BRANCH already holds a status checked at the same time or later"
              exit 0
            fi
          fi
          blob="$(jq -n --rawfile content "$file" '{content: $content, encoding: "utf-8"}' | gh api "$api/git/blobs" --input - --jq .sha)"
          tree="$(jq -n --arg blob "$blob" '{tree: [{path: "dependency-scan.json", mode: "100644", type: "blob", sha: $blob}]}' | gh api "$api/git/trees" --input - --jq .sha)"
          commit="$(jq -n --arg tree "$tree" --arg parent "$parent" --arg message "Dependency status of $TAG" \
            '{message: $message, tree: $tree, parents: (if $parent == "" then [] else [$parent] end)}' | gh api "$api/git/commits" --input - --jq .sha)"
          if [ -z "$parent" ]; then
            jq -n --arg ref "refs/heads/$BRANCH" --arg sha "$commit" '{ref: $ref, sha: $sha}' | gh api "$api/git/refs" --input - > /dev/null
          else
            jq -n --arg sha "$commit" '{sha: $sha, force: false}' | gh api -X PATCH "$api/git/refs/heads/$BRANCH" --input - > /dev/null
          fi
          echo "$BRANCH: $commit"

  # A finding blocks nothing, but it must not go unnoticed: the run ends red and names it.
  # One on main becomes a task; one on the latest release becomes an urgent patch release.
  findings:
    needs: [scan, publish]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Require no open advisory of moderate or higher
        env:
          SCAN_RESULT: ${{ needs.scan.result }}
          MAIN_BLOCKING: ${{ needs.scan.outputs.main-blocking }}
          RELEASE: ${{ needs.scan.outputs.release }}
          RELEASE_BLOCKING: ${{ needs.scan.outputs.release-blocking }}
        run: |
          status=0
          if [ "$SCAN_RESULT" != success ]; then echo "The scan did not complete: $SCAN_RESULT"; status=1; fi
          if [ "${MAIN_BLOCKING:-0}" != 0 ]; then echo "main: $MAIN_BLOCKING open advisories of moderate or higher"; status=1; fi
          if [ -n "$RELEASE" ] && [ "${RELEASE_BLOCKING:-0}" != 0 ]; then echo "$RELEASE: $RELEASE_BLOCKING open advisories of moderate or higher"; status=1; fi
          exit "$status"
