name: Build release

on:
  workflow_dispatch:
    inputs:
      version:
        description: New release tag, a pre-release such as v1.0.0-rc.1 or a final version such as v1.0.0 (gated)
        required: true
        type: string
      source-sha:
        description: Full source commit SHA already on main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # A final version (no pre-release part, so no hyphen) is public: it is built
  # only after the security gate passes. Pre-releases skip the gate.
  gate:
    if: github.ref == 'refs/heads/main' && !contains(inputs.version, '-')
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: read
      security-events: read
      # Dependabot alerts of the ecosystems the npm dependency check does not cover.
      vulnerability-alerts: read
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      SOURCE_SHA: ${{ inputs.source-sha }}
    steps:
      # The gate runs from main's current workflow commit, never from the source being released.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The source is checked out only for its lock files; none of its code runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # The same dependency check as the scheduled dependency scan. A failed check leaves no result,
      # which the gate step names as a reason together with any other.
      - name: Check the dependencies of the source
        continue-on-error: true
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node src/release/dependency-scan.ts --repository source --commit "$SOURCE_SHA" --target "release $RELEASE_VERSION" --version "$RELEASE_VERSION" --run-url "$RUN_URL" --output "$RUNNER_TEMP/dependencies"
      - name: Check the security gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # The workflow token cannot read secret scanning alerts; without this read-only token the gate refuses.
          SECRET_SCANNING_TOKEN: ${{ secrets.SECRET_SCANNING_READ_TOKEN }}
          # The user id of the bot user of the GitHub App that posts the security-gate status and may
          # write nothing but commit statuses; the gate refuses the status from anyone else.
          SECURITY_GATE_CREATOR_ID: '357280908'
          DEPENDENCY_RESULT: ${{ runner.temp }}/dependencies/dependency-result.json
        run: node src/release/gate.ts "$GITHUB_REPOSITORY" "$SOURCE_SHA"
      # The report job reads the result, and the draft release carries the status as its first dependency scan.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-scan
          path: ${{ runner.temp }}/dependencies
          retention-days: 90
          if-no-files-found: error

  # A final version's security report and the summary behind the README's security image, read
  # right after the gate passed. A report that cannot be written stops the release before its tag.
  report:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: read
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      SOURCE_SHA: ${{ inputs.source-sha }}
    steps:
      # Like the gate, the report runs from main's current workflow commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dependency-scan
          path: ${{ runner.temp }}/dependencies
      - name: Write the security report
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node src/release/security-report.ts "$GITHUB_REPOSITORY" "$SOURCE_SHA" "$RELEASE_VERSION" "$RUNNER_TEMP/dependencies/dependency-result.json" "$RUNNER_TEMP/security"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-report
          path: ${{ runner.temp }}/security
          # Only the publish job of this run reads it; the draft release keeps the files.
          retention-days: 1
          if-no-files-found: error

  # The full suite on the source commit, in the same four shards as CI: one
  # runner needs about 20 minutes for it, four need under 10. Builds nothing
  # that the release ships.
  test:
    name: test (${{ matrix.shard }}/4)
    needs: gate
    # Runs after a passed gate, or without one only for a pre-release.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (needs.gate.result == 'success' || (needs.gate.result == 'skipped' && contains(inputs.version, '-'))) }}
    runs-on: ubuntu-latest
    # Keep headroom as the suite grows, including setup and hook installs in each shard.
    timeout-minutes: 20
    # Every shard runs to the end, as in CI, so one run shows every failure.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      SOURCE_SHA: ${{ inputs.source-sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate and check out source
        run: |
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          cp .github/requirements/pre-commit.txt "$RUNNER_TEMP/pre-commit-requirements.txt"
          git checkout --detach "$SOURCE_SHA"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install compatible npm
        run: npm install --global --ignore-scripts npm@11.21.2
      - name: Install locked build dependencies without scripts
        run: |
          node --input-type=module -e 'import { validateVersion, validateSha } from "./src/release/package.ts"; validateVersion(process.env.RELEASE_VERSION); validateSha(process.env.SOURCE_SHA);'
          npm ci --ignore-scripts
      - name: Verify dependency admission
        run: |
          npm audit signatures
          npm run check:install-scripts
          npm run check:cyrillic
      # Unlike CI, no pre-commit cache is restored: a release does not reuse hook environments that other runs wrote.
      - name: Install pre-commit
        run: |
          environment=$(mktemp -d "$RUNNER_TEMP/pre-commit.XXXXXX")
          python3 -m venv "$environment"
          "$environment/bin/python" -m pip install --require-hashes --only-binary :all: -r "$RUNNER_TEMP/pre-commit-requirements.txt"
          mkdir "$environment/commands"
          ln -s "$environment/bin/pre-commit" "$environment/commands/pre-commit"
          echo "$environment/commands" >> "$GITHUB_PATH"
      # Bundle tests need the release entry points on this runner too.
      - name: Build test bundles
        run: npm run build
      - name: Test
        run: node --test --test-shard=${{ matrix.shard }}/4 "src/**/*.test.ts" "tools/**/*.test.ts" "test/**/*.test.ts" "test/**/*.test.mjs"

  build:
    needs: [gate, test]
    # Builds only after every test shard passed, and after a passed gate or without one only for a pre-release.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.test.result == 'success' && (needs.gate.result == 'success' || (needs.gate.result == 'skipped' && contains(inputs.version, '-'))) }}
    runs-on: ubuntu-latest
    # Leave headroom for setup, type checking, bundling and the release smoke tests.
    timeout-minutes: 20
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      SOURCE_SHA: ${{ inputs.source-sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate and check out source
        run: |
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          cp .github/requirements/pre-commit.txt "$RUNNER_TEMP/pre-commit-requirements.txt"
          git checkout --detach "$SOURCE_SHA"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install compatible npm
        run: npm install --global --ignore-scripts npm@11.21.2
      - name: Install locked build dependencies without scripts
        run: |
          node --input-type=module -e 'import { validateVersion, validateSha } from "./src/release/package.ts"; validateVersion(process.env.RELEASE_VERSION); validateSha(process.env.SOURCE_SHA);'
          npm ci --ignore-scripts
      - name: Verify dependency admission
        run: |
          npm audit signatures
          npm run check:install-scripts
          npm run check:cyrillic
      # The staged flow below runs the templates' security hooks through pre-commit.
      - name: Install pre-commit
        run: |
          environment=$(mktemp -d "$RUNNER_TEMP/pre-commit.XXXXXX")
          python3 -m venv "$environment"
          "$environment/bin/python" -m pip install --require-hashes --only-binary :all: -r "$RUNNER_TEMP/pre-commit-requirements.txt"
          mkdir "$environment/commands"
          ln -s "$environment/bin/pre-commit" "$environment/commands/pre-commit"
          echo "$environment/commands" >> "$GITHUB_PATH"
      - name: Check and build source
        run: |
          npm run typecheck
          npm run build
      - name: Stage and verify self-contained release
        run: |
          MDBISYNC_RELEASE_VERSION="${RELEASE_VERSION#v}" npm run build
          node src/release/prepare.ts "$SOURCE_SHA" "$RELEASE_VERSION" "$RUNNER_TEMP/release"
          node src/release/smoke.ts "$RUNNER_TEMP/release"
          node test/release/staged-flow.ts "$RUNNER_TEMP/release"
          tar -C "$RUNNER_TEMP/release" -cf "$RUNNER_TEMP/release.tar" .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-tree
          path: ${{ runner.temp }}/release.tar
          retention-days: 1
          if-no-files-found: error
      # A final version also gets an SPDX SBOM of its bundled packages; a pre-release skips both steps.
      - name: Write the SBOM of the release
        if: ${{ !contains(inputs.version, '-') }}
        run: node src/release/sbom.ts "$GITHUB_REPOSITORY" "$SOURCE_SHA" "$RELEASE_VERSION" "$RUNNER_TEMP/release" "$RUNNER_TEMP/sbom.spdx.json"
      - if: ${{ !contains(inputs.version, '-') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-sbom
          path: ${{ runner.temp }}/sbom.spdx.json
          retention-days: 90
          if-no-files-found: error

  # Signs build provenance and the SBOM for every file of the release tree before
  # the tag publishes it. It needs a passed gate and a written security report, so
  # it runs only for a final version that can be tagged. It runs no repository code
  # and alone holds the id-token permission.
  attest:
    needs: [gate, report, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
      attestations: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      SOURCE_SHA: ${{ inputs.source-sha }}
    steps:
      # The provenance names the commit the workflow was dispatched on as the source it was built from,
      # so a final version must be built from that commit: main's head at dispatch.
      - name: Require the source to be the dispatched commit
        run: |
          if [ "$SOURCE_SHA" != "$GITHUB_SHA" ]; then
            echo "A final release must be built from main's head at dispatch ($GITHUB_SHA), not $SOURCE_SHA." >&2
            exit 1
          fi
      # The tag job checks this again before it pushes; checking here first avoids signing a version that already exists.
      - name: Refuse a version whose tag already exists
        run: |
          existing="$(git ls-remote --tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "refs/tags/$RELEASE_VERSION")"
          test -z "$existing"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-tree
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-sbom
          path: ${{ runner.temp }}
      - name: List the release files as attestation subjects
        run: |
          mkdir "$RUNNER_TEMP/release"
          tar -C "$RUNNER_TEMP/release" -xf "$RUNNER_TEMP/release.tar"
          cd "$RUNNER_TEMP/release"
          find . -type f -printf '%P\0' | LC_ALL=C sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/subjects.sha256"
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/subjects.sha256
      - name: Attest the SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/subjects.sha256
          sbom-path: ${{ runner.temp }}/sbom.spdx.json

  tag:
    needs: [gate, report, build, attest]
    # A skipped gate (every pre-release) would skip this job under the implicit success(), so the condition is explicit.
    # It repeats the build's gate rule, so a final version is never tagged without a passed gate, its security report
    # and its attestations.
    if: ${{ !cancelled() && needs.build.result == 'success' && ((needs.gate.result == 'success' && needs.report.result == 'success' && needs.attest.result == 'success') || (needs.gate.result == 'skipped' && contains(inputs.version, '-'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      release-sha: ${{ steps.tag.outputs.release-sha }}
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      SOURCE_SHA: ${{ inputs.source-sha }}
    steps:
      # Publish with the dispatched workflow's implementation even for an older source.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-tree
          path: ${{ runner.temp }}
      - name: Append release commit to releases and create new tag
        id: tag
        run: |
          mkdir "$RUNNER_TEMP/release"
          tar -C "$RUNNER_TEMP/release" -xf "$RUNNER_TEMP/release.tar"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node src/release/tag.ts "$SOURCE_SHA" "$RELEASE_VERSION" "$RUNNER_TEMP/release"

  # Moves the workflow templates on main to a new final release; a pre-release leaves them as they are
  # and says so in the summary. A release commit cannot name its own SHA, so the pins go to main
  # afterwards: this job commits them on the branch release-pins-<version>, cut from main's current
  # head, and pushes it; a pull request from that branch takes them to main through the usual checks.
  # It never pushes to main and never forces a push. Like the tag job, it runs the dispatched
  # workflow's implementation, with Node and Git only. A pull request the workflow token opens would
  # run its checks only after someone approves them, so the release pins App opens it and turns on
  # auto-merge. The App's variable and secret live in the environment release-pins, which allows only
  # main and has no reviewers, so a release needs no second approval; the tag job runs only on main, so
  # this job's ref always meets that rule. Without the App's variable and secret, or when the App fails,
  # the summary links the branch instead and the release still succeeds.
  pins:
    needs: tag
    # Explicit, like the tag job's: a pre-release skips the gate, and the implicit success() would skip this job too.
    if: ${{ !cancelled() && needs.tag.result == 'success' }}
    environment: release-pins
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_SHA: ${{ needs.tag.outputs.release-sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Main's current head and every release tag, the new one included; only this checkout can push.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: target
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Push the templates pinned to the new release
        id: pins
        run: |
          git -C target config user.name 'github-actions[bot]'
          git -C target config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node src/release/pins.ts "$RELEASE_VERSION" "$RELEASE_SHA" target
      - name: Check the release pins App configuration
        id: app
        if: ${{ steps.pins.outputs.branch != '' }}
        env:
          APP_CLIENT_ID: ${{ vars.RELEASE_PINS_APP_CLIENT_ID }}
          APP_PRIVATE_KEY_SET: ${{ secrets.RELEASE_PINS_APP_PRIVATE_KEY != '' }}
        run: |
          if [ -n "$APP_CLIENT_ID" ] && [ "$APP_PRIVATE_KEY_SET" = true ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'The release pins App is not configured (environment `release-pins`: variable `RELEASE_PINS_APP_CLIENT_ID`, secret `RELEASE_PINS_APP_PRIVATE_KEY`), so no pull request was opened: open it from the branch above.' >> "$GITHUB_STEP_SUMMARY"
          fi
      # The token is limited to this repository and to what opening and merging the pull request needs,
      # and is revoked when the job ends. Only the next step reads it, and it runs no repository code.
      # The tag and the branch are already pushed, so an App that does not work only warns.
      - name: Get a token of the release pins App
        id: token
        if: ${{ steps.app.outputs.configured == 'true' }}
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_PINS_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PINS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - name: Open the pins pull request with auto-merge
        if: ${{ steps.app.outputs.configured == 'true' }}
        working-directory: ${{ runner.temp }}
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PINS_BRANCH: ${{ steps.pins.outputs.branch }}
        run: |
          by_hand() {
            echo "::warning::$1"
            echo "$1: open the pull request from the branch above." >> "$GITHUB_STEP_SUMMARY"
          }
          if [ -z "$GH_TOKEN" ]; then
            by_hand 'The release pins App gave no token (is it installed on this repository with Contents and Pull requests read and write?)'
            exit 0
          fi
          if ! url=$(gh pr create --repo "$GH_REPO" --base main --head "$PINS_BRANCH" --title "Pin the workflow templates to $RELEASE_VERSION" \
            --body "Moves the workflow templates, the templates \`init\` writes, its list of older releases and the configuration page to $RELEASE_VERSION (release commit $RELEASE_SHA)."); then
            by_hand 'The release pins App could not open the pull request'
            exit 0
          fi
          if gh pr merge "$url" --repo "$GH_REPO" --auto --squash; then
            echo "Opened $url with auto-merge: it merges once its required checks pass and any review main requires is given." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Auto-merge could not be turned on for $url"
            echo "Opened $url, but auto-merge could not be turned on (is \"Allow auto-merge\" on in the repository settings?): merge it once its checks pass." >> "$GITHUB_STEP_SUMMARY"
          fi

  # A final version gets a draft GitHub Release that carries its security report and summary, its
  # SPDX SBOM and the dependency status of its build. The scheduled dependency scan never changes a release.
  # It stays a draft until a maintainer publishes it. It runs no repository code.
  publish:
    needs: [report, tag]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: security-report
          path: ${{ runner.temp }}/security
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-sbom
          path: ${{ runner.temp }}/sbom
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dependency-scan
          path: ${{ runner.temp }}/dependencies
      - name: Create the draft release with the security report
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_VERSION" --draft --verify-tag --title "$RELEASE_VERSION" \
            --notes 'The security report of this release is attached as security-report.md and its SPDX SBOM as sbom.spdx.json.' \
            "$RUNNER_TEMP/security/security-report.md" "$RUNNER_TEMP/security/security-summary.json" \
            "$RUNNER_TEMP/sbom/sbom.spdx.json" "$RUNNER_TEMP/dependencies/dependency-scan.json"

  # A run that created no tag must not end as success, even when every job before it was skipped.
  tagged:
    if: ${{ !cancelled() }}
    needs: tag
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Require the new tag
        env:
          TAG_RESULT: ${{ needs.tag.result }}
        run: test "$TAG_RESULT" = success
