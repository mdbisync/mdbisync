name: Build pre-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: New pre-release tag (for example v0.1.0-rc.1)
        required: true
        type: string
      source-sha:
        description: Full source commit SHA already on main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      SOURCE_SHA: ${{ inputs.source-sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate and check out source
        run: |
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          git checkout --detach "$SOURCE_SHA"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked build dependencies without scripts
        run: |
          node --input-type=module -e 'import { validateVersion, validateSha } from "./src/release/package.ts"; validateVersion(process.env.RELEASE_VERSION); validateSha(process.env.SOURCE_SHA);'
          npm ci --ignore-scripts
      - name: Verify dependency admission
        run: |
          npm audit signatures
          npm run check:install-scripts
          npm run check:cyrillic
      - name: Check, build and test source
        run: |
          npm run typecheck
          npm run build
          npm test
      - name: Stage and verify self-contained release
        run: |
          MDBISYNC_RELEASE_VERSION="${RELEASE_VERSION#v}" npm run build
          node src/release/prepare.ts "$SOURCE_SHA" "$RELEASE_VERSION" "$RUNNER_TEMP/release"
          node src/release/smoke.ts "$RUNNER_TEMP/release"
          tar -C "$RUNNER_TEMP/release" -cf "$RUNNER_TEMP/release.tar" .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-tree
          path: ${{ runner.temp }}/release.tar
          retention-days: 1
          if-no-files-found: error

  tag:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      SOURCE_SHA: ${{ inputs.source-sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-sha }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-tree
          path: ${{ runner.temp }}
      - name: Create isolated release commit and new tag
        run: |
          mkdir "$RUNNER_TEMP/release"
          tar -C "$RUNNER_TEMP/release" -xf "$RUNNER_TEMP/release.tar"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node src/release/tag.ts "$SOURCE_SHA" "$RELEASE_VERSION" "$RUNNER_TEMP/release"
