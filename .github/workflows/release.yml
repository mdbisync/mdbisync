name: Build release

on:
  workflow_dispatch:
    inputs:
      version:
        description: New release tag, a pre-release such as v0.1.0-rc.1 or a final version such as v0.1.0 (gated)
        required: true
        type: string
      source-sha:
        description: Full source commit SHA already on main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # A final version (no pre-release part, so no hyphen) is public: it is built
  # only after the security gate passes. Pre-releases skip the gate.
  gate:
    if: github.ref == 'refs/heads/main' && !contains(inputs.version, '-')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: read
      security-events: read
      vulnerability-alerts: read
    env:
      SOURCE_SHA: ${{ inputs.source-sha }}
    steps:
      # The gate runs from main's current workflow commit, never from the source being released.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Check the security gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # The workflow token cannot read secret scanning alerts; without this read-only token the gate refuses.
          SECRET_SCANNING_TOKEN: ${{ secrets.SECRET_SCANNING_READ_TOKEN }}
        run: node src/release/gate.ts "$GITHUB_REPOSITORY" "$SOURCE_SHA"

  # The full suite on the source commit, in the same four shards as CI: one
  # runner needs about 20 minutes for it, four need under 10. Builds nothing
  # that the release ships.
  test:
    name: test (${{ matrix.shard }}/4)
    needs: gate
    # Runs after a passed gate, or without one only for a pre-release.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (needs.gate.result == 'success' || (needs.gate.result == 'skipped' && contains(inputs.version, '-'))) }}
    runs-on: ubuntu-latest
    # Keep headroom as the suite grows, including setup and hook installs in each shard.
    timeout-minutes: 20
    # Every shard runs to the end, as in CI, so one run shows every failure.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      SOURCE_SHA: ${{ inputs.source-sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate and check out source
        run: |
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          cp .github/requirements/pre-commit.txt "$RUNNER_TEMP/pre-commit-requirements.txt"
          git checkout --detach "$SOURCE_SHA"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install compatible npm
        run: npm install --global --ignore-scripts npm@11.21.2
      - name: Install locked build dependencies without scripts
        run: |
          node --input-type=module -e 'import { validateVersion, validateSha } from "./src/release/package.ts"; validateVersion(process.env.RELEASE_VERSION); validateSha(process.env.SOURCE_SHA);'
          npm ci --ignore-scripts
      - name: Verify dependency admission
        run: |
          npm audit signatures
          npm run check:install-scripts
          npm run check:cyrillic
      # Unlike CI, no pre-commit cache is restored: a release does not reuse hook environments that other runs wrote.
      - name: Install pre-commit
        run: |
          environment=$(mktemp -d "$RUNNER_TEMP/pre-commit.XXXXXX")
          python3 -m venv "$environment"
          "$environment/bin/python" -m pip install --require-hashes --only-binary :all: -r "$RUNNER_TEMP/pre-commit-requirements.txt"
          mkdir "$environment/commands"
          ln -s "$environment/bin/pre-commit" "$environment/commands/pre-commit"
          echo "$environment/commands" >> "$GITHUB_PATH"
      # Bundle tests need the release entry points on this runner too.
      - name: Build test bundles
        run: npm run build
      - name: Test
        run: node --test --test-shard=${{ matrix.shard }}/4 "src/**/*.test.ts" "tools/**/*.test.ts" "test/**/*.test.ts" "test/**/*.test.mjs"

  build:
    needs: [gate, test]
    # Builds only after every test shard passed, and after a passed gate or without one only for a pre-release.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.test.result == 'success' && (needs.gate.result == 'success' || (needs.gate.result == 'skipped' && contains(inputs.version, '-'))) }}
    runs-on: ubuntu-latest
    # Leave headroom for setup, type checking, bundling and the release smoke tests.
    timeout-minutes: 20
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      SOURCE_SHA: ${{ inputs.source-sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate and check out source
        run: |
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          cp .github/requirements/pre-commit.txt "$RUNNER_TEMP/pre-commit-requirements.txt"
          git checkout --detach "$SOURCE_SHA"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install compatible npm
        run: npm install --global --ignore-scripts npm@11.21.2
      - name: Install locked build dependencies without scripts
        run: |
          node --input-type=module -e 'import { validateVersion, validateSha } from "./src/release/package.ts"; validateVersion(process.env.RELEASE_VERSION); validateSha(process.env.SOURCE_SHA);'
          npm ci --ignore-scripts
      - name: Verify dependency admission
        run: |
          npm audit signatures
          npm run check:install-scripts
          npm run check:cyrillic
      # The staged flow below runs the templates' security hooks through pre-commit.
      - name: Install pre-commit
        run: |
          environment=$(mktemp -d "$RUNNER_TEMP/pre-commit.XXXXXX")
          python3 -m venv "$environment"
          "$environment/bin/python" -m pip install --require-hashes --only-binary :all: -r "$RUNNER_TEMP/pre-commit-requirements.txt"
          mkdir "$environment/commands"
          ln -s "$environment/bin/pre-commit" "$environment/commands/pre-commit"
          echo "$environment/commands" >> "$GITHUB_PATH"
      - name: Check and build source
        run: |
          npm run typecheck
          npm run build
      - name: Stage and verify self-contained release
        run: |
          MDBISYNC_RELEASE_VERSION="${RELEASE_VERSION#v}" npm run build
          node src/release/prepare.ts "$SOURCE_SHA" "$RELEASE_VERSION" "$RUNNER_TEMP/release"
          node src/release/smoke.ts "$RUNNER_TEMP/release"
          node test/release/staged-flow.ts "$RUNNER_TEMP/release"
          tar -C "$RUNNER_TEMP/release" -cf "$RUNNER_TEMP/release.tar" .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-tree
          path: ${{ runner.temp }}/release.tar
          retention-days: 1
          if-no-files-found: error
      # A final version also gets an SPDX SBOM of its bundled packages; a pre-release skips both steps.
      - name: Write the SBOM of the release
        if: ${{ !contains(inputs.version, '-') }}
        run: node src/release/sbom.ts "$GITHUB_REPOSITORY" "$SOURCE_SHA" "$RELEASE_VERSION" "$RUNNER_TEMP/release" "$RUNNER_TEMP/sbom.spdx.json"
      - if: ${{ !contains(inputs.version, '-') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-sbom
          path: ${{ runner.temp }}/sbom.spdx.json
          retention-days: 90
          if-no-files-found: error

  # Signs build provenance and the SBOM for every file of the release tree before
  # the tag publishes it. It needs a passed gate, so it runs only for a final
  # version. It runs no repository code and alone holds the id-token permission.
  attest:
    needs: [gate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
      attestations: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      SOURCE_SHA: ${{ inputs.source-sha }}
    steps:
      # The provenance names the commit the workflow was dispatched on as the source it was built from,
      # so a final version must be built from that commit: main's head at dispatch.
      - name: Require the source to be the dispatched commit
        run: |
          if [ "$SOURCE_SHA" != "$GITHUB_SHA" ]; then
            echo "A final release must be built from main's head at dispatch ($GITHUB_SHA), not $SOURCE_SHA." >&2
            exit 1
          fi
      # The tag job checks this again before it pushes; checking here first avoids signing a version that already exists.
      - name: Refuse a version whose tag already exists
        run: |
          existing="$(git ls-remote --tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "refs/tags/$RELEASE_VERSION")"
          test -z "$existing"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-tree
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-sbom
          path: ${{ runner.temp }}
      - name: List the release files as attestation subjects
        run: |
          mkdir "$RUNNER_TEMP/release"
          tar -C "$RUNNER_TEMP/release" -xf "$RUNNER_TEMP/release.tar"
          cd "$RUNNER_TEMP/release"
          find . -type f -printf '%P\0' | LC_ALL=C sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/subjects.sha256"
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/subjects.sha256
      - name: Attest the SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/subjects.sha256
          sbom-path: ${{ runner.temp }}/sbom.spdx.json

  tag:
    needs: [gate, build, attest]
    # A skipped gate (every pre-release) would skip this job under the implicit success(), so the condition is explicit.
    # It repeats the build's gate rule, so a final version is never tagged without a passed gate and its attestations.
    if: ${{ !cancelled() && needs.build.result == 'success' && ((needs.gate.result == 'success' && needs.attest.result == 'success') || (needs.gate.result == 'skipped' && contains(inputs.version, '-'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      SOURCE_SHA: ${{ inputs.source-sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-sha }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-tree
          path: ${{ runner.temp }}
      - name: Create isolated release commit and new tag
        run: |
          mkdir "$RUNNER_TEMP/release"
          tar -C "$RUNNER_TEMP/release" -xf "$RUNNER_TEMP/release.tar"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node src/release/tag.ts "$SOURCE_SHA" "$RELEASE_VERSION" "$RUNNER_TEMP/release"

  # A run that created no tag must not end as success, even when every job before it was skipped.
  tagged:
    if: ${{ !cancelled() }}
    needs: tag
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Require the new tag
        env:
          TAG_RESULT: ${{ needs.tag.result }}
        run: test "$TAG_RESULT" = success
