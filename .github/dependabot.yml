version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    versioning-strategy: increase
    open-pull-requests-limit: 5
    ignore:
      # Type definitions stay on the Node.js major the action runs on
      # (`runs.using` in action.yml); a newer major would let code use APIs
      # the runtime lacks. Bump the @types/node major by hand together with
      # the runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
  # `.github/requirements/pre-commit.txt`, the hash-checked list CI and
  # release install and every workflow template copies inline. Dependabot
  # finds it because it sits in a folder named `requirements`. One grouped
  # pull request updates the whole list and changes only that file: the
  # workflow tests fail until the same lines are copied into the templates
  # in `examples/` and `src/init/workflows.json`, and the install check
  # finds a hashed wheel for each pin on Python 3.11 to 3.14.
  - package-ecosystem: pip
    directory: /.github
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      pre-commit:
        patterns: ["*"]
