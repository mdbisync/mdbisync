version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    versioning-strategy: increase
    open-pull-requests-limit: 5
    ignore:
      # Type definitions stay on the Node.js major the action runs on
      # (`runs.using` in action.yml); a newer major would let code use APIs
      # the runtime lacks. Bump the @types/node major by hand together with
      # the runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
