<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img" aria-labelledby="title desc">
  <title id="title">How mdbisync works</title>
  <desc id="desc">Linear on the left, a GitHub Actions run in your runner in the middle, your GitHub repository on the right. The run captures Linear's edits as files through your security hooks into the state refs, opens the sync pull request that merges itself into main once your checks pass, merges main with Linear's record from the state refs, writes the result to Linear and records Linear's answer in the state refs.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 11px; }
    .title { font-size: 13.5px; font-weight: 600; }
    .sub { font-size: 11.5px; fill: #59636e; }
    .tab { font-size: 12px; font-weight: 600; }
    .box { fill: #ffffff; stroke: #d1d9e0; stroke-width: 1; }
    .group { fill: none; stroke: #8c959f; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .tabbg { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1; }
    .flow { fill: none; stroke: #8c959f; stroke-width: 1.6; }
    .head { fill: #8c959f; }
    .stateflow { fill: none; stroke: #9a6700; stroke-width: 1.4; stroke-dasharray: 4 3; }
    .statehead { fill: #9a6700; }
    .linear { fill: #5e6ad2; }
    .run { fill: #0969da; }
    .refs { fill: #9a6700; }
    .pr { fill: #8250df; }
    .main { fill: #1a7f37; }
    @media (prefers-color-scheme: dark) {
      text { fill: #f0f6fc; }
      .sub { fill: #9198a1; }
      .box { fill: #151b23; stroke: #3d444d; }
      .tabbg { fill: #212830; stroke: #656c76; }
      .group { stroke: #656c76; }
      .flow { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .stateflow { stroke: #d29922; }
      .statehead { fill: #d29922; }
      .linear { fill: #7c86e8; }
      .run { fill: #4493f8; }
      .refs { fill: #d29922; }
      .pr { fill: #ab7df8; }
      .main { fill: #3fb950; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="statearrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="statehead" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <!-- Linear -->
  <rect class="box" x="20" y="180" width="160" height="120" rx="8"/>
  <rect class="linear" x="20" y="180" width="5" height="120" rx="2"/>
  <text class="title" x="38" y="210">Linear</text>
  <text class="sub" x="38" y="232">documents in your</text>
  <text class="sub" x="38" y="248">teams and projects</text>
  <text class="sub" x="38" y="276">via your own</text>
  <text class="sub" x="38" y="291">Linear OAuth app</text>

  <!-- The run -->
  <rect class="group" x="220" y="40" width="320" height="400" rx="10"/>
  <rect class="tabbg" x="232" y="28" width="296" height="24" rx="12"/>
  <text class="tab" x="380" y="44" text-anchor="middle">GitHub Actions run, in your runner</text>

  <rect class="box" x="236" y="72" width="288" height="46" rx="6"/>
  <rect class="run" x="236" y="72" width="4" height="46" rx="2"/>
  <text class="title" x="250" y="91">0  Setup check</text>
  <text class="sub" x="250" y="108">stops before any write when setup fails</text>

  <rect class="box" x="236" y="128" width="288" height="46" rx="6"/>
  <rect class="run" x="236" y="128" width="4" height="46" rx="2"/>
  <text class="title" x="250" y="147">1  Capture</text>
  <text class="sub" x="250" y="164">Linear edits become files, through your hooks</text>

  <rect class="box" x="236" y="184" width="288" height="46" rx="6"/>
  <rect class="run" x="236" y="184" width="4" height="46" rx="2"/>
  <text class="title" x="250" y="203">2  Linear to git</text>
  <text class="sub" x="250" y="220">opens or updates the sync pull request</text>

  <rect class="box" x="236" y="240" width="288" height="46" rx="6"/>
  <rect class="run" x="236" y="240" width="4" height="46" rx="2"/>
  <text class="title" x="250" y="259">3  Git to Linear</text>
  <text class="sub" x="250" y="276">three-way merge of main and Linear's record</text>

  <rect class="box" x="236" y="296" width="288" height="46" rx="6"/>
  <rect class="run" x="236" y="296" width="4" height="46" rx="2"/>
  <text class="title" x="250" y="315">4  Write</text>
  <text class="sub" x="250" y="332">creates, updates, moves, trashes documents</text>

  <rect class="box" x="236" y="352" width="288" height="46" rx="6"/>
  <rect class="run" x="236" y="352" width="4" height="46" rx="2"/>
  <text class="title" x="250" y="371">5  Record</text>
  <text class="sub" x="250" y="388">Linear's answer goes to the state refs</text>

  <rect class="tabbg" x="236" y="408" width="288" height="22" rx="11"/>
  <text class="sub" x="380" y="423" text-anchor="middle">runs on push to main, every 5 min, by hand</text>

  <!-- The repository -->
  <rect class="group" x="580" y="40" width="300" height="400" rx="10"/>
  <rect class="tabbg" x="610" y="28" width="240" height="24" rx="12"/>
  <text class="tab" x="730" y="44" text-anchor="middle">Your GitHub repository</text>

  <rect class="box" x="596" y="72" width="268" height="140" rx="6"/>
  <rect class="refs" x="596" y="72" width="4" height="140" rx="2"/>
  <text class="title" x="610" y="92">Three state refs</text>
  <text class="mono" x="610" y="112">refs/mdbisync/linear</text>
  <text class="sub" x="610" y="126">what Linear held at the last run</text>
  <text class="mono" x="610" y="148">refs/mdbisync/ids</text>
  <text class="sub" x="610" y="162">which document each file is</text>
  <text class="mono" x="610" y="184">refs/mdbisync/uploads</text>
  <text class="sub" x="610" y="198">where each uploaded file lives</text>

  <rect class="box" x="596" y="224" width="268" height="88" rx="6"/>
  <rect class="pr" x="596" y="224" width="4" height="88" rx="2"/>
  <text class="title" x="610" y="244">Sync pull request</text>
  <text class="sub" x="610" y="264">“Changes from Linear”, from the</text>
  <text class="sub" x="610" y="280">branch <tspan class="mono">mdbisync/linear</tspan></text>
  <text class="sub" x="610" y="300">merges itself once your checks pass</text>

  <rect class="box" x="596" y="330" width="268" height="80" rx="6"/>
  <rect class="main" x="596" y="330" width="4" height="80" rx="2"/>
  <text class="title" x="610" y="350"><tspan class="mono" style="font-size:13px;font-weight:600">main</tspan></text>
  <text class="sub" x="610" y="370">your Markdown files, the branch</text>
  <text class="sub" x="610" y="386">the sync keeps equal to Linear</text>

  <!-- Flows -->
  <path class="flow" marker-end="url(#arrow)" d="M180,215 C210,215 205,151 234,151"/>
  <path class="flow" marker-end="url(#arrow)" d="M236,319 C205,319 210,265 182,265"/>
  <path class="stateflow" marker-end="url(#statearrow)" d="M524,151 C555,151 560,128 594,128"/>
  <path class="stateflow" marker-end="url(#statearrow)" d="M596,186 C562,186 562,256 526,256"/>
  <path class="stateflow" marker-end="url(#statearrow)" d="M524,378 C568,378 562,200 594,200"/>
  <path class="flow" marker-end="url(#arrow)" d="M524,207 C560,207 560,268 594,268"/>
  <path class="flow" marker-end="url(#arrow)" d="M730,312 L730,328"/>
  <path class="flow" marker-end="url(#arrow)" d="M596,374 C556,374 560,270 526,270"/>
</svg>
