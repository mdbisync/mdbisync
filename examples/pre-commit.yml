# Copy to .github/workflows/pre-commit.yml in a synchronized repository.
# Install Node 24.2 or newer and pre-commit locally too. Hook revs must pin
# release commits containing dist/cli.js and a dependency-free package.json.
name: Pre-commit

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pre-commit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Runs the pull request's hooks, which are the pull request's own code. A
  # step can change the later steps of its job (through GITHUB_ENV and
  # GITHUB_PATH), so this job can only read and no step of it holds a write
  # token; its fix reaches the next job only as data that job checks.
  hooks:
    name: pre-commit hooks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.fixes.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install compatible npm
        run: npm install --global --ignore-scripts npm@11.21.2
      - name: Install pre-commit
        shell: bash
        run: |
          # Python runs in isolated mode (-I) from the runner's temporary
          # directory, so no module of the checkout can stand in for venv or pip.
          cd "$RUNNER_TEMP"
          if [[ "$(pre-commit --version 2>/dev/null || true)" != "pre-commit 4.7.0" ]]; then
            if ! command -v python3 >/dev/null 2>&1; then
              echo '::error::Install Python 3 with venv support, or provide pre-commit on PATH.'
              exit 1
            fi
            # The patched filelock in this list needs Python 3.11; the hashed wheels stop at 3.14.
            if ! python3 -I -c 'import sys; sys.exit(not (3, 11) <= sys.version_info[:2] <= (3, 14))'; then
              echo "Found $(python3 -I -V 2>&1)."
              echo '::error::Python 3.11 to 3.14 is required; install it, or provide pre-commit on PATH.'
              exit 1
            fi
            environment=$(mktemp -d "$RUNNER_TEMP/pre-commit.XXXXXX")
            if ! python3 -I -m venv "$environment"; then
              echo '::error::Python 3 venv support is required; install it, or provide pre-commit on PATH.'
              exit 1
            fi
            # Only these files are installed: pip refuses a file whose hash is not
            # listed and builds nothing from source.
            if ! "$environment/bin/python" -I -m pip install --require-hashes --only-binary :all: -r /dev/stdin <<'REQUIREMENTS'; then
          cfgv==3.5.0 --hash=sha256:a8dc6b26ad22ff227d2634a65cb388215ce6cc96bbcc5cfde7641ae87e8dacc0
          distlib==0.4.4 --hash=sha256:ca4175b4ac7f71223cc30ed7248c45d2b38c2439d8ee6e498ab67ed63cf3508d --hash=sha256:cf09d55b1e85a89576b036aeb71550bfd68320f3f21761ca329eadadad918638
          filelock==4.2.10 --hash=sha256:9479aaeb4db20b5a53e3da28493edd24720b66b8a0b84030aa56ccdf243d6857
          identify==2.6.20 --hash=sha256:6a16b69b93187244e0548cbfd25b3e4a6f9a7a2ad784625c3bec2b8d27b81aaa --hash=sha256:ad729860a923858d26917c2f4fb0a1d83d27a75b1e090c06440c573f048f3285
          nodeenv==1.12.0 --hash=sha256:4ea7f88339310afebc3253f2c7a91b94bacf97d73a36a5c108962abdfaca501e --hash=sha256:80644d65c10cc2be12e3e4b54b3367ff288c7ad24ae75c2dcc65454fc7449d4d
          packaging==26.3 --hash=sha256:d7193f7c8e4e93f444fde0262bf90af30e16fa0ad0ad44cb553c87339b23cd1c
          platformdirs==4.14.2 --hash=sha256:6d13b4c1d66b7548dcec9e3db13c1ba9d9adb65041b5d07869313afc07e6e41b --hash=sha256:dc1f93390f2a9265e44e5afc8667ec7faf737739604e39bc538fec889720c36b
          pre-commit==4.7.0 --hash=sha256:1f3deee12b914c8fa184bd2b5953391c2e4f36763e403d4a23dc9983fa7c6e86 --hash=sha256:2e229038ad3656081b70c27913157e4b636ef306f643f024a8a8e3f0f7b2f877
          python-discovery==1.9.5 --hash=sha256:a1fae8fca11e4bc61e38491c2aafff29e430b3c5e272d51ae52fb895bc4c0fac
          pyyaml==6.0.3 \
            --hash=sha256:44edc647873928551a01e7a563d7452ccdebee747728c1080d881d68af7b997e \
            --hash=sha256:652cb6edd41e718550aad172851962662ff2681490a8a711af6a4d288dd96824 \
            --hash=sha256:10892704fc220243f5305762e276552a0395f7beb4dbf9b14ec8fd43b57f126c \
            --hash=sha256:b8bb0864c5a28024fac8a632c443c87c5aa6f215c0b126c449ae1a150412f31d \
            --hash=sha256:1d37d57ad971609cf3c53ba6a7e365e40660e3be0e5175fa9f2365a379d6095a \
            --hash=sha256:37503bfbfc9d2c40b344d06b2199cf0e96e97957ab1c1b546fd4f87e53e5d3e4 \
            --hash=sha256:7f047e29dcae44602496db43be01ad42fc6f1cc0d8cd6c83d342306c32270196 \
            --hash=sha256:fc09d0aa354569bc501d4e787133afc08552722d3ab34836a80547331bb5d4a0 \
            --hash=sha256:9149cad251584d5fb4981be1ecde53a1ca46c891a79788c0df828d2f166bda28 \
            --hash=sha256:ba1cc08a7ccde2d2ec775841541641e4548226580ab850948cbfda66a1befcdc \
            --hash=sha256:8dc52c23056b9ddd46818a57b78404882310fb473d63f17b07d5c40421e47f8e \
            --hash=sha256:41715c910c881bc081f1e8872880d3c650acf13dfa8214bad49ed4cede7c34ea \
            --hash=sha256:8da9669d359f02c0b91ccc01cac4a67f16afec0dac22c2ad09f46bee0697eba8 \
            --hash=sha256:2283a07e2c21a2aa78d9c4442724ec1eb15f5e42a723b99cb3d822d48f5f7ad1 \
            --hash=sha256:ee2922902c45ae8ccada2c5b501ab86c36525b883eff4255313a253a3160861c \
            --hash=sha256:0f29edc409a6392443abf94b9cf89ce99889a1dd5376d94316ae5145dfedd5d6 \
            --hash=sha256:f7057c9a337546edc7973c0d3ba84ddcdf0daa14533c2065749c9075001090e6 \
            --hash=sha256:eda16858a3cab07b80edaf74336ece1f986ba330fdb8ee0d6c0d68fe82bc96be \
            --hash=sha256:8d1fab6bb153a416f9aeb4b8763bc0f22a5586065f86f7664fc23339fc1c1fac \
            --hash=sha256:34d5fcd24b8445fadc33f9cf348c1047101756fd760b4dacb5c3e99755703310 \
            --hash=sha256:501a031947e3a9025ed4405a168e6ef5ae3126c59f90ce0cd6f2bfc477be31b7 \
            --hash=sha256:c458b6d084f9b935061bc36216e8a69a7e293a2f1e68bf956dcd9e6cbcd143f5 \
            --hash=sha256:7c6610def4f163542a622a73fb39f534f8c101d690126992300bf3207eab9764 \
            --hash=sha256:5190d403f121660ce8d1d2c1bb2ef1bd05b5f68533fc5c2ea899bd15f4399b35 \
            --hash=sha256:02893d100e99e03eda1c8fd5c441d8c60103fd175728e23e431db1b589cf5ab3 \
            --hash=sha256:c1ff362665ae507275af2853520967820d9124984e0f7466736aea23d8611fba \
            --hash=sha256:6adc77889b628398debc7b65c073bcb99c4a0237b248cacaf3fe8a557563ef6c \
            --hash=sha256:00c4bdeba853cc34e7dd471f16b4114f4162dc03e6b7afcc2128711f0eca823c \
            --hash=sha256:66e1674c3ef6f541c35191caae2d429b967b99e02040f5ba928632d9a7f0f065 \
            --hash=sha256:16249ee61e95f858e83976573de0f5b2893b3677ba71c9dd36b9cf8be9ac6d65
          virtualenv==21.15.6 --hash=sha256:4b99ab9b95ff11043939bb4cad2fa0449175fa5a478372864f62160cb6c1a7ed
          REQUIREMENTS
              echo '::error::Could not install pre-commit 4.7.0 from its pinned hashes; use Python 3.11 to 3.14 on Linux or macOS (x86-64 or arm64) with access to PyPI, or provide pre-commit on PATH.'
              exit 1
            fi
            mkdir "$environment/commands"
            ln -s "$environment/bin/pre-commit" "$environment/commands/pre-commit"
            echo "$environment/commands" >> "$GITHUB_PATH"
          fi
      - name: Run all hooks and collect fixes
        id: hooks
        shell: bash
        run: |
          # A formatter exits 1 when it edits a file. The final pass below
          # decides whether the configuration is now clean.
          pre-commit run --all-files --show-diff-on-failure --color=never | tee "$RUNNER_TEMP/pre-commit.log" || true
      - name: Commit fixes or show the fork patch
        id: fixes
        env:
          SAME_REPOSITORY: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        shell: bash
        run: |
          git -c core.fsmonitor=false -c core.hooksPath=/dev/null add --update
          if ! git diff --cached --quiet; then
            if [[ "$SAME_REPOSITORY" != true ]]; then
              echo 'Apply this patch to the pull request branch, then push again:'
              git diff --cached --binary
              exit 1
            fi
            # Use pre-commit's Python, which already has its YAML dependency.
            # Limit untrusted output to configured ids before creating trailers.
            read -r interpreter < "$(command -v pre-commit)" || interpreter=''
            read -ra python_command <<< "${interpreter#\#!}"
            if [[ "${python_command[0]##*/}" != python* ]]; then
              python_command=(python3)
            fi
            # Isolated (-I): the checkout is not on its module path.
            "${python_command[@]}" -I - <<'PY' || printf 'Apply pre-commit fixes\n' > "$RUNNER_TEMP/pre-commit-message"
          import os
          import re
          from pathlib import Path
          import yaml
          config = yaml.safe_load(Path('.pre-commit-config.yaml').read_text())
          configured = {hook['id'] for repo in config['repos'] for hook in repo['hooks']}
          temporary = Path(os.environ['RUNNER_TEMP'])
          hooks = set()
          hook = None
          for line in (temporary / 'pre-commit.log').read_text().splitlines():
              match = re.fullmatch(r'- hook id: (.+)', line)
              if match:
                  hook = match[1] if match[1] in configured else None
              if line == '- files were modified by this hook' and hook:
                  hooks.add(hook)
          (temporary / 'pre-commit-message').write_text('Apply pre-commit fixes\n\n' + ''.join(f'Pre-commit-fix: {hook}\n' for hook in sorted(hooks)))
          PY
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                -c core.hooksPath=/dev/null commit -F "$RUNNER_TEMP/pre-commit-message"
            # The fix and its message go to the publish job, which checks both.
            mkdir -p "$RUNNER_TEMP/pre-commit-fix"
            git diff --binary --no-ext-diff --no-textconv HEAD^ HEAD > "$RUNNER_TEMP/pre-commit-fix/fix.patch"
            cp "$RUNNER_TEMP/pre-commit-message" "$RUNNER_TEMP/pre-commit-fix/message"
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Check the fixed tree in the same job
        id: checks
        if: ${{ !cancelled() && steps.hooks.outcome == 'success' }}
        run: |
          pre-commit run --all-files --show-diff-on-failure
          git diff --exit-code
          git diff --cached --exit-code
      - name: Keep the fix for the publish job
        if: ${{ !cancelled() && steps.fixes.outputs.changed == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pre-commit-fix
          path: ${{ runner.temp }}/pre-commit-fix
          if-no-files-found: error
          overwrite: true # A re-run of all jobs uploads it again.
          retention-days: 1

  # Pushes the hooks' fix to a same-repository branch and starts genuine CI
  # on that head. The only job with a write token: it starts on a fresh runner,
  # never runs the pull request's code (no hooks, no repository scripts or
  # git hooks) and applies the fix only after checking it as data.
  publish:
    name: pre-commit fixes
    needs: hooks
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.hooks.result == 'success' && needs.hooks.outputs.changed == 'true' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # Push the fixing commit to the pull request branch.
      actions: write # Start this workflow and the other CI on the fixing commit.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pre-commit-fix
          path: ${{ runner.temp }}/pre-commit-fix
      - name: Apply the checked fix
        id: fixes
        shell: bash
        run: |
          # The fix comes from the job that ran the pull request's code: it may
          # change only files the pull request already tracks as regular files,
          # and the commit message keeps only hook ids from its message.
          git_safe() { git -c core.fsmonitor=false -c core.hooksPath=/dev/null "$@"; }
          refuse() { echo "::error::The pre-commit fix is refused: $1."; exit 1; }
          fix="$RUNNER_TEMP/pre-commit-fix"
          for file in "$fix/fix.patch" "$fix/message"; do
            [[ -f "$file" && ! -L "$file" ]] || refuse 'its files are missing'
          done
          [[ -z "$(git_safe apply --summary -- "$fix/fix.patch")" ]] || refuse 'it creates, deletes, renames or changes the mode of a file'
          while IFS= read -r -d '' entry; do
            path=${entry#*$'\t'}
            path=${path#*$'\t'}
            mode=''
            read -r -d '' mode _ < <(git_safe ls-files --stage -z -- ":(literal)$path") || true
            [[ "$mode" == 100644 || "$mode" == 100755 ]] || refuse 'it changes a path that is not a tracked regular file'
          done < <(git_safe apply --numstat -z -- "$fix/fix.patch")
          mapfile -t lines < "$fix/message"
          [[ "${lines[0]-}" == 'Apply pre-commit fixes' ]] || refuse 'its message is not the one the hooks job writes'
          message='Apply pre-commit fixes'
          trailers=''
          for line in "${lines[@]:1}"; do
            if [[ "$line" =~ ^Pre-commit-fix:\ [[:graph:]]{1,200}$ ]]; then
              trailers+=$'\n'"$line"
            elif [[ -n "$line" ]]; then
              echo '::warning::A line of the fix message that names no hook id is left out of the fixing commit.'
            fi
          done
          [[ -z "$trailers" ]] || message+=$'\n'"$trailers"
          # Quietly: a warning would echo the patch's text into the log.
          git_safe apply --index --whitespace=nowarn -- "$fix/fix.patch"
          # What was staged decides, since a patch's headers need not state every change.
          [[ -z "$(git_safe diff --cached --no-renames --summary)" ]] || refuse 'it creates, deletes or changes the mode of a file'
          git_safe -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit --no-verify -m "$message"
          echo "sha=$(git_safe rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Push fixes
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          # No repository-configured subprocess hooks while credentials exist.
          authorization=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c core.fsmonitor=false -c core.hooksPath=/dev/null -c credential.helper= \
              -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $authorization" \
              push origin "HEAD:refs/heads/$HEAD_BRANCH"
      - name: Start genuine CI on the fixing commit
        # A GITHUB_TOKEN push starts no workflows. Dispatch this workflow
        # again and the configured CI so every result belongs to a real job
        # on the fixed head. Synthetic check runs are not proof of CI.
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          WORKFLOWS: ${{ vars.MDBISYNC_CI_WORKFLOWS }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        shell: bash
        run: |
          own_workflow=${WORKFLOW_REF#*/.github/workflows/}
          own_workflow=${own_workflow%%@*}
          WORKFLOWS="$own_workflow $WORKFLOWS"
          read -ra workflows <<< "$(printf '%s' "$WORKFLOWS" | tr ',\r\n' '   ')"
          for workflow in "${workflows[@]}"; do
            if [[ ! "$workflow" =~ ^[A-Za-z0-9._-]+\.ya?ml$ ]]; then
              echo '::error::MDBISYNC_CI_WORKFLOWS must list workflow file names, such as tests.yml, separated by spaces or commas.'
              exit 1
            fi
          done
          payload=$(node -e 'console.log(JSON.stringify({ref: process.env.HEAD_BRANCH}))')
          for workflow in "${workflows[@]}"; do
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPOSITORY/actions/workflows/$workflow/dispatches" --data "$payload"
          done

  # The check to require: it passes only when the hooks passed and their fix,
  # if any, was published, as when both ran in one job.
  pre-commit:
    needs: [hooks, publish]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require the hooks and the published fix
        env:
          HOOKS_RESULT: ${{ needs.hooks.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: |
          echo "Hooks: $HOOKS_RESULT. Fix published: $PUBLISH_RESULT."
          [[ "$HOOKS_RESULT" == success && ( "$PUBLISH_RESULT" == success || "$PUBLISH_RESULT" == skipped ) ]]
