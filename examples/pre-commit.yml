# Copy to .github/workflows/pre-commit.yml in a synchronized repository.
# Install Node 24 and pre-commit locally too. Hook revs must pin release
# commits containing dist/cli.js and a dependency-free package.json.
name: Pre-commit

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pre-commit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # Fork pull requests retain a read-only token.
      checks: write # Attach the result to the fixing commit too.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install compatible npm
        run: npm install --global --ignore-scripts npm@11.21.2
      - name: Install pre-commit
        shell: bash
        run: |
          if [[ "$(pre-commit --version 2>/dev/null || true)" != "pre-commit 4.6.2" ]]; then
            if ! command -v python3 >/dev/null 2>&1; then
              echo '::error::Install Python 3 with venv support, or provide pre-commit on PATH.'
              exit 1
            fi
            # The patched filelock in this list needs Python 3.11; the hashed wheels stop at 3.14.
            if ! python3 -c 'import sys; sys.exit(not (3, 11) <= sys.version_info[:2] <= (3, 14))'; then
              echo "Found $(python3 -V 2>&1)."
              echo '::error::Python 3.11 to 3.14 is required; install it, or provide pre-commit on PATH.'
              exit 1
            fi
            environment=$(mktemp -d "$RUNNER_TEMP/pre-commit.XXXXXX")
            if ! python3 -m venv "$environment"; then
              echo '::error::Python 3 venv support is required; install it, or provide pre-commit on PATH.'
              exit 1
            fi
            # Only these files are installed: pip refuses a file whose hash is not
            # listed and builds nothing from source.
            if ! "$environment/bin/python" -m pip install --require-hashes --only-binary :all: -r /dev/stdin <<'REQUIREMENTS'; then
          cfgv==3.5.0 --hash=sha256:a8dc6b26ad22ff227d2634a65cb388215ce6cc96bbcc5cfde7641ae87e8dacc0
          distlib==0.4.3 --hash=sha256:4b0ce306c966eb73bc3a7b6abad017c556dadd92c44701562cd528ac7fde4d5b
          filelock==4.2.10 --hash=sha256:9479aaeb4db20b5a53e3da28493edd24720b66b8a0b84030aa56ccdf243d6857
          identify==2.6.19 --hash=sha256:20e6a87f786f768c092a721ad107fc9df0eb89347be9396cadf3f4abbd1fb78a
          nodeenv==1.10.0 --hash=sha256:5bb13e3eed2923615535339b3c620e76779af4cb4c6a90deccc9e36b274d3827
          packaging==26.3 --hash=sha256:d7193f7c8e4e93f444fde0262bf90af30e16fa0ad0ad44cb553c87339b23cd1c
          platformdirs==4.11.2 --hash=sha256:7f89089b6ea71bda7962953edcf784b2e2d9d285b40ad88be2bb75c6e9d82ab4
          pre-commit==4.6.2 --hash=sha256:e2dde9a75d3bce11bd3831c26d134df00a2803c1d818be6a0383c3dcda25dc4e
          python-discovery==1.9.5 --hash=sha256:a1fae8fca11e4bc61e38491c2aafff29e430b3c5e272d51ae52fb895bc4c0fac
          pyyaml==6.0.3 \
            --hash=sha256:44edc647873928551a01e7a563d7452ccdebee747728c1080d881d68af7b997e \
            --hash=sha256:652cb6edd41e718550aad172851962662ff2681490a8a711af6a4d288dd96824 \
            --hash=sha256:10892704fc220243f5305762e276552a0395f7beb4dbf9b14ec8fd43b57f126c \
            --hash=sha256:b8bb0864c5a28024fac8a632c443c87c5aa6f215c0b126c449ae1a150412f31d \
            --hash=sha256:1d37d57ad971609cf3c53ba6a7e365e40660e3be0e5175fa9f2365a379d6095a \
            --hash=sha256:37503bfbfc9d2c40b344d06b2199cf0e96e97957ab1c1b546fd4f87e53e5d3e4 \
            --hash=sha256:7f047e29dcae44602496db43be01ad42fc6f1cc0d8cd6c83d342306c32270196 \
            --hash=sha256:fc09d0aa354569bc501d4e787133afc08552722d3ab34836a80547331bb5d4a0 \
            --hash=sha256:9149cad251584d5fb4981be1ecde53a1ca46c891a79788c0df828d2f166bda28 \
            --hash=sha256:ba1cc08a7ccde2d2ec775841541641e4548226580ab850948cbfda66a1befcdc \
            --hash=sha256:8dc52c23056b9ddd46818a57b78404882310fb473d63f17b07d5c40421e47f8e \
            --hash=sha256:41715c910c881bc081f1e8872880d3c650acf13dfa8214bad49ed4cede7c34ea \
            --hash=sha256:8da9669d359f02c0b91ccc01cac4a67f16afec0dac22c2ad09f46bee0697eba8 \
            --hash=sha256:2283a07e2c21a2aa78d9c4442724ec1eb15f5e42a723b99cb3d822d48f5f7ad1 \
            --hash=sha256:ee2922902c45ae8ccada2c5b501ab86c36525b883eff4255313a253a3160861c \
            --hash=sha256:0f29edc409a6392443abf94b9cf89ce99889a1dd5376d94316ae5145dfedd5d6 \
            --hash=sha256:f7057c9a337546edc7973c0d3ba84ddcdf0daa14533c2065749c9075001090e6 \
            --hash=sha256:eda16858a3cab07b80edaf74336ece1f986ba330fdb8ee0d6c0d68fe82bc96be \
            --hash=sha256:8d1fab6bb153a416f9aeb4b8763bc0f22a5586065f86f7664fc23339fc1c1fac \
            --hash=sha256:34d5fcd24b8445fadc33f9cf348c1047101756fd760b4dacb5c3e99755703310 \
            --hash=sha256:501a031947e3a9025ed4405a168e6ef5ae3126c59f90ce0cd6f2bfc477be31b7 \
            --hash=sha256:c458b6d084f9b935061bc36216e8a69a7e293a2f1e68bf956dcd9e6cbcd143f5 \
            --hash=sha256:7c6610def4f163542a622a73fb39f534f8c101d690126992300bf3207eab9764 \
            --hash=sha256:5190d403f121660ce8d1d2c1bb2ef1bd05b5f68533fc5c2ea899bd15f4399b35 \
            --hash=sha256:02893d100e99e03eda1c8fd5c441d8c60103fd175728e23e431db1b589cf5ab3 \
            --hash=sha256:c1ff362665ae507275af2853520967820d9124984e0f7466736aea23d8611fba \
            --hash=sha256:6adc77889b628398debc7b65c073bcb99c4a0237b248cacaf3fe8a557563ef6c \
            --hash=sha256:00c4bdeba853cc34e7dd471f16b4114f4162dc03e6b7afcc2128711f0eca823c \
            --hash=sha256:66e1674c3ef6f541c35191caae2d429b967b99e02040f5ba928632d9a7f0f065 \
            --hash=sha256:16249ee61e95f858e83976573de0f5b2893b3677ba71c9dd36b9cf8be9ac6d65
          virtualenv==21.15.6 --hash=sha256:4b99ab9b95ff11043939bb4cad2fa0449175fa5a478372864f62160cb6c1a7ed
          REQUIREMENTS
              echo '::error::Could not install pre-commit 4.6.2 from its pinned hashes; use Python 3.11 to 3.14 on Linux or macOS (x86-64 or arm64) with access to PyPI, or provide pre-commit on PATH.'
              exit 1
            fi
            mkdir "$environment/commands"
            ln -s "$environment/bin/pre-commit" "$environment/commands/pre-commit"
            echo "$environment/commands" >> "$GITHUB_PATH"
          fi
      - name: Run all hooks and collect fixes
        id: hooks
        shell: bash
        run: |
          # A formatter exits 1 when it edits a file. The final pass below
          # decides whether the configuration is now clean.
          pre-commit run --all-files --show-diff-on-failure --color=never | tee "$RUNNER_TEMP/pre-commit.log" || true
      - name: Commit fixes or show the fork patch
        id: fixes
        env:
          SAME_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        shell: bash
        run: |
          git -c core.fsmonitor=false -c core.hooksPath=/dev/null add --update
          if ! git diff --cached --quiet; then
            if [[ "$SAME_REPOSITORY" != true ]]; then
              echo 'Apply this patch to the pull request branch, then push again:'
              git diff --cached --binary
              exit 1
            fi
            # Use pre-commit's Python, which already has its YAML dependency.
            # Limit untrusted output to configured ids before creating trailers.
            read -r interpreter < "$(command -v pre-commit)" || interpreter=''
            read -ra python_command <<< "${interpreter#\#!}"
            if [[ "${python_command[0]##*/}" != python* ]]; then
              python_command=(python3)
            fi
            "${python_command[@]}" - <<'PY' || printf 'Apply pre-commit fixes\n' > "$RUNNER_TEMP/pre-commit-message"
          import os
          import re
          from pathlib import Path
          import yaml
          config = yaml.safe_load(Path('.pre-commit-config.yaml').read_text())
          configured = {hook['id'] for repo in config['repos'] for hook in repo['hooks']}
          temporary = Path(os.environ['RUNNER_TEMP'])
          hooks = set()
          hook = None
          for line in (temporary / 'pre-commit.log').read_text().splitlines():
              match = re.fullmatch(r'- hook id: (.+)', line)
              if match:
                  hook = match[1] if match[1] in configured else None
              if line == '- files were modified by this hook' and hook:
                  hooks.add(hook)
          (temporary / 'pre-commit-message').write_text('Apply pre-commit fixes\n\n' + ''.join(f'Pre-commit-fix: {hook}\n' for hook in sorted(hooks)))
          PY
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                -c core.hooksPath=/dev/null commit -F "$RUNNER_TEMP/pre-commit-message"
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Push fixes
        if: ${{ steps.fixes.outputs.changed == 'true' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          # Disable repository-configured subprocess hooks while credentials exist.
          authorization=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c core.fsmonitor=false -c core.hooksPath=/dev/null -c credential.helper= \
              -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $authorization" \
              push origin "HEAD:refs/heads/$HEAD_BRANCH"
      - name: Mark the fixing commit pending
        id: fixed-check
        if: ${{ steps.fixes.outputs.changed == 'true' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CHECKED_SHA: ${{ steps.fixes.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          payload=$(node -e 'console.log(JSON.stringify({name: "pre-commit", head_sha: process.env.CHECKED_SHA, status: "in_progress", details_url: process.env.RUN_URL}))')
          response=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPOSITORY/check-runs" --data "$payload")
          check_id=$(node -e 'const id=JSON.parse(process.argv[1]).id; if (!Number.isSafeInteger(id)) process.exit(1); console.log(id)' "$response")
          echo "id=$check_id" >> "$GITHUB_OUTPUT"
      - name: Check the fixed tree in the same job
        id: checks
        # A GITHUB_TOKEN push does not start another workflow run.
        if: ${{ !cancelled() && steps.hooks.outcome == 'success' }}
        run: |
          pre-commit run --all-files --show-diff-on-failure
          git diff --exit-code
          git diff --cached --exit-code
      - name: Publish result on the fixing commit
        if: ${{ always() && steps.fixed-check.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CHECK_ID: ${{ steps.fixed-check.outputs.id }}
          CHECK_OUTCOME: ${{ steps.checks.outcome }}
          JOB_STATUS: ${{ job.status }}
        run: |
          conclusion=failure
          if [[ "$CHECK_OUTCOME" == success && "$JOB_STATUS" == success ]]; then
            conclusion=success
          fi
          payload=$(node -e 'console.log(JSON.stringify({status: "completed", conclusion: process.argv[1]}))' "$conclusion")
          curl --fail-with-body --silent --show-error --request PATCH \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPOSITORY/check-runs/$CHECK_ID" --data "$payload"
