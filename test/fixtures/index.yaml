# Fixture bank index. Format: see README.md in this folder.
version: 1
groups:
  - id: construct-singles
    title: "Construct singles"
  - id: pairwise
    title: "Pairwise combinations"
  - id: work-documents
    title: "Realistic work documents"
  - id: size-spectrum
    title: "Size spectrum"
  - id: mermaid
    title: "Mermaid"
  - id: tables
    title: "Tables"
  - id: typography-scripts
    title: "Typography and scripts"
  - id: links
    title: "Links"
  - id: front-matter
    title: "Front matter"
  - id: html-extensions
    title: "HTML and extensions"
  - id: conflict-markers
    title: "Conflict-marker lookalikes"
  - id: lint-errors
    title: "Lint errors"
  - id: images
    title: "Images"
  - id: attachments
    title: "Attachments"
  - id: list-items
    title: "Links, images and tasks in list and table items"
  - id: unsynced
    title: "Unsynced files"
rules:
  - id: footnote
    title: "Footnotes are dropped."
  - id: subscript
    title: "Tilde subscript is dropped."
  - id: table-escaped-pipe
    title: "An escaped pipe in a plain table cell splits the row."
  - id: image-in-link
    title: "The link around an image is dropped."
  - id: content-too-long
    title: "Documents over 250,000 characters are rejected."
  - id: duplicate-title
    title: "Two files map to one document title."
  - id: table-alignment
    title: "Table column alignment is dropped."
  - id: link-title
    title: "A link title is dropped."
  - id: image-title
    title: "An image title is dropped from the Markdown."
  - id: code-in-emphasis
    title: "Bold or italic around inline code is dropped from the code."
  - id: hard-break-backslash
    title: "A backslash line break becomes a plain line break."
  - id: hard-break-in-heading
    title: "A hard line break in a setext heading is lost when the heading is written as one line."
  - id: git-conflict-marker
    title: "Git conflict marker lines are rewritten as headings, quotes or collapsible sections."
  - id: section-opener
    title: "A line starting with >>> opens a collapsible section that fix cannot write next to +++ lines."
  - id: url-in-html
    title: "A URL inside raw HTML is turned into a Markdown link."
  - id: block-first-in-list-item
    title: "A list item that starts with a heading, code, a quote or another block is written in a form Markdown reads as an empty item."
  - id: ordered-task-list
    title: "An ordered task list becomes a bullet task list."
  - id: table-hash-cell
    title: "A table body cell starting with # becomes a heading."
  - id: image-not-in-repository
    title: "An image must be a relative path to a file of the repository, not a URL, an absolute path or a path outside it."
  - id: image-file-missing
    title: "An image must name a file that exists in the repository, not a folder or a Markdown document."
  - id: table-list-cell
    title: "A table body cell starting with -, + or * and a space, or with a number and ), becomes a list, which Linear writes with * or a number and a dot. Put a backslash before the -, + or *, or reword the cell."
  - id: setext-heading-lines
    title: "Linear keeps only the first line of a heading underlined with = or - as the heading; the lines after it become a paragraph. Put the heading text on one line."
  - id: table-header-pipe
    title: "A table whose header row has no | is plain text in Linear. Write the header row between pipes, as | Total |."
  - id: number-paragraph
    title: "A paragraph that is only a number and a dot or parenthesis comes back from Linear without the backslash, which reads as an empty numbered list item."
