rules:
  - id: footnote
    title: "Footnotes are dropped."
  - id: subscript
    title: "Tilde subscript is dropped."
  - id: table-escaped-pipe
    title: "An escaped pipe in a plain table cell splits the row."
  - id: image-in-link
    title: "The link around an image is dropped."
  - id: content-too-long
    title: "Documents over 250,000 characters are rejected."
  - id: duplicate-title
    title: "Two files map to one document title."
  - id: table-alignment
    title: "Table column alignment is dropped."
  - id: link-title
    title: "A link title is dropped."
  - id: image-title
    title: "An image title is dropped from the Markdown."
  - id: code-in-emphasis
    title: "Bold or italic around inline code is dropped from the code."
  - id: hard-break-backslash
    title: "A backslash line break becomes a plain line break."
  - id: git-conflict-marker
    title: "Git conflict marker lines are rewritten as headings, quotes or collapsible sections."
  - id: url-in-html
    title: "A URL inside raw HTML is turned into a Markdown link."
  - id: block-first-in-list-item
    title: "A list item that starts with a heading, code or quote is written in a form Markdown reads as an empty item."
  - id: table-hash-cell
    title: "A table body cell starting with # becomes a heading."
