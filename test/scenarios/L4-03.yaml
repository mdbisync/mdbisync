{
  "version": 1,
  "id": "L4-03",
  "slice": "mini",
  "mode": "local",
  "setup": {
    "state": "converged",
    "fixtures": [
      "mini"
    ],
    "teamZoneLock": true
  },
  "steps": [
    {
      "kind": "git",
      "action": "edit",
      "args": {}
    },
    {
      "kind": "fault",
      "action": "pause",
      "args": {
        "checkpoint": "after-reread-before-write"
      }
    },
    {
      "kind": "run",
      "action": "sync",
      "args": {
        "wait": false
      }
    },
    {
      "kind": "linear",
      "action": "repeated-edit",
      "args": {
        "actor": "editor-a",
        "count": 100
      }
    },
    {
      "kind": "fault",
      "action": "resume",
      "args": {}
    },
    {
      "kind": "run",
      "action": "settle",
      "args": {}
    }
  ],
  "checks": {
    "invariants": {
      "I1": {
        "required": true
      },
      "I2": {
        "required": false,
        "reason": "This scenario measures the accepted re-read/write race, including any observed loss; it must report the measured loss rather than assert zero."
      },
      "I3": {
        "required": true
      },
      "I4": {
        "required": true
      },
      "I5": {
        "required": true
      },
      "I6": {
        "required": true
      },
      "I7": {
        "required": true
      },
      "I8": {
        "required": true
      },
      "I9": {
        "required": true
      }
    },
    "assertions": [
      {
        "subject": "report.metrics",
        "operator": "contains-all",
        "expected": [
          "raceWindowMs",
          "raceOutcome",
          "lostEditCount"
        ]
      }
    ]
  }
}
