  "checks": {
    "invariants": {
      "I1": {
        "required": true
      },
      "I2": {
        "required": true
      },
      "I3": {
        "required": true
      },
      "I4": {
        "required": true
      },
      "I5": {
        "required": true
      },
      "I6": {
        "required": true
      },
      "I7": {
        "required": true
      },
      "I8": {
        "required": true
      },
      "I9": {
        "required": true
      }
    },
    "assertions": [
