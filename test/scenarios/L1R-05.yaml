{
  "version": 1,
  "id": "L1R-05",
  "slice": "mini",
  "mode": "local",
  "setup": {
    "state": "empty",
    "fixtures": [
      "mini"
    ],
    "teamZoneLock": true
  },
  "steps": [
    {
      "kind": "linear",
      "action": "seed",
      "args": {
        "actor": "editor-a",
        "fixture": "unsafe-titles",
        "titles": [
          "Notes: draft?*",
          " leading",
          "/part/notes"
        ]
      }
    },
    {
      "kind": "run",
      "action": "initial-sync",
      "args": {
        "direction": "linear-to-git",
        "confirm": true
      }
    }
  ],
  "checks": {
    "invariants": {
      "I1": {
        "required": false,
        "reason": "File names are inspected on the unmerged initial pull request."
      },
      "I2": {
        "required": false,
        "reason": "File names are inspected on the unmerged initial pull request."
      },
      "I3": {
        "required": true
      },
      "I4": {
        "required": true
      },
      "I5": {
        "required": true
      },
      "I6": {
        "required": false,
        "reason": "File names are inspected on the unmerged initial pull request."
      },
      "I7": {
        "required": false,
        "reason": "File names are inspected on the unmerged initial pull request."
      },
      "I8": {
        "required": true
      },
      "I9": {
        "required": true
      }
    },
    "assertions": [
      {
        "subject": "paths.rule",
        "operator": "equal",
        "expected": "percent-encode-unsafe-segments"
      },
      {
        "subject": "paths.collisionCount",
        "operator": "equal",
        "expected": 0
      },
      {
        "subject": "documents.titles",
        "operator": "same-as",
        "expected": "before.documents.titles"
      }
    ]
  },
  "proposedRule": "Preserve slash-separated nonempty path segments, percent-encode unsafe characters and leading spaces, encode empty segments; append .md and disambiguate collisions by document ID."
}
