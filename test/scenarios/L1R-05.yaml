{
  "version": 1,
  "id": "L1R-05",
  "slice": "mini",
  "mode": "local",
  "setup": {
    "state": "linear-seeded",
    "fixtures": [
      "unsafe-titles",
      "unsafe-title-samples"
    ],
    "teamZoneLock": true
  },
  "steps": [
    {
      "kind": "run",
      "action": "initial-sync",
      "args": {
        "direction": "linear-to-git",
        "confirm": true
      }
    }
  ],
  "checks": {
    "invariants": {
      "I1": {
        "required": false,
        "reason": "File names are inspected on the unmerged initial pull request."
      },
      "I2": {
        "required": false,
        "reason": "File names are inspected on the unmerged initial pull request."
      },
      "I3": {
        "required": true
      },
      "I4": {
        "required": true
      },
      "I5": {
        "required": true
      },
      "I6": {
        "required": false,
        "reason": "File names are inspected on the unmerged initial pull request."
      },
      "I7": {
        "required": false,
        "reason": "File names are inspected on the unmerged initial pull request."
      },
      "I8": {
        "required": true
      },
      "I9": {
        "required": true
      }
    },
    "assertions": [
      {
        "subject": "paths.rule",
        "operator": "equal",
        "expected": "percent-encode-unsafe-segments"
      },
      {
        "subject": "paths.collisionCount",
        "operator": "equal",
        "expected": 0
      },
      {
        "subject": "documents.titles",
        "operator": "same-as",
        "expected": "before.documents.titles"
      },
      {
        "subject": "paths.titleToPath",
        "operator": "same-as",
        "expected": "fixtures.unsafeTitlePaths"
      },
      {
        "subject": "paths.decodedTitles",
        "operator": "same-as",
        "expected": "before.documents.titles"
      }
    ]
  },
  "proposedRule": "Preserve slash-separated path segments and leading spaces, percent-encode unsafe characters and trailing periods and spaces, encode reserved and empty segments; append .md and disambiguate collisions by a document ID hash."
}
